<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>سایت در حال آپدیت است</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Tahoma,Arial,sans-serif;
    background:radial-gradient(ellipse at top, #101018 0%, #0a0a0f 60%);
    color:#e8e8e8;
    direction:rtl;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:1.5rem;
    overflow:hidden;
  }
  .box{
    text-align:center;
    max-width:480px;
    animation:fadeIn .6s ease-out;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .icon{
    font-size:4.5rem;
    margin-bottom:1.2rem;
    display:inline-block;
    animation:spin 3.5s linear infinite;
    filter:drop-shadow(0 0 20px rgba(255,193,68,.35));
  }
  @keyframes spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
  }
  h1{
    color:#ffc144;
    font-size:1.7rem;
    margin-bottom:.8rem;
  }
  p{
    color:#bbb;
    font-size:1rem;
    line-height:2;
  }
  .bar{
    width:60px;
    height:3px;
    background:#ffc144;
    margin:1.4rem auto;
    border-radius:2px;
    opacity:.6;
  }
  .dots{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:1.6rem;
  }
  .dots span{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ffc144;
    opacity:.4;
    animation:bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0);opacity:.4}
    40%{transform:translateY(-8px);opacity:1}
  }
  .progress-track{
    width:100%;
    max-width:280px;
    height:6px;
    background:#1d1d26;
    border-radius:4px;
    margin:1.8rem auto 0;
    overflow:hidden;
    border:1px solid #2a2a35;
  }
  .progress-fill{
    height:100%;
    width:40%;
    background:linear-gradient(90deg,#ffc144,#ff8c44);
    border-radius:4px;
    animation:progress 2.2s ease-in-out infinite;
  }
  @keyframes progress{
    0%{width:10%;margin-right:0}
    50%{width:60%;margin-right:0}
    100%{width:10%;margin-right:90%}
  }
  .note{
    margin-top:2.5rem;
    font-size:.72rem;
    color:#555;
  }
  .glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,193,68,.06) 0%, transparent 70%);
    z-index:-1;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="box">
    <div class="icon">🛠️</div>
    <h1>سایت در حال آپدیت است</h1>
    <div class="bar"></div>
    <p>در حال انجام تغییرات هستیم.<br/>به‌زودی سایت باز خواهد شد.</p>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="note">جنگ جهانی</div>
  </div>
</body>
</html>
