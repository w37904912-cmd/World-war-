<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>سایت بسته است</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Tahoma,Arial,sans-serif;
    background:#0a0a0f;
    color:#e8e8e8;
    direction:rtl;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:1.5rem;
  }
  .box{
    text-align:center;
    max-width:480px;
  }
  .icon{
    font-size:4.5rem;
    margin-bottom:1.2rem;
    filter:drop-shadow(0 0 20px rgba(255,68,68,.35));
  }
  h1{
    color:#ff4444;
    font-size:1.7rem;
    margin-bottom:1rem;
  }
  p{
    color:#bbb;
    font-size:1rem;
    line-height:2;
  }
  .bar{
    width:60px;
    height:3px;
    background:#ff4444;
    margin:1.6rem auto;
    border-radius:2px;
    opacity:.6;
  }
  .note{
    margin-top:2.5rem;
    font-size:.72rem;
    color:#555;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🚫</div>
    <h1>سایت بسته شد</h1>
    <div class="bar"></div>
    <p>امکان دسترسی به امکانات را ندارید.</p>
    <div class="note">جنگ جهانی</div>
  </div>
</body>
</html>
